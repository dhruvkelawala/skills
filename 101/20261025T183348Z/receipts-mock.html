<!doctype html><meta charset="utf-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 390px; height: 844px; background: #f6f4ef; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: #1d1b16; }
header { padding: 64px 20px 12px; }
h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
.after h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; }
.sub { margin-top: 4px; color: #77705f; font-size: 14px; }
ul { list-style: none; margin: 12px 16px; background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 0 #e7e2d6; }
li { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: 1px solid #efebe2; }
li:first-child { border-top: none; }
.initial { width: 36px; height: 36px; border-radius: 50%; background: #e9e4d8; display: grid; place-items: center; font-weight: 600; color: #5b5444; }
.after .initial { background: #2f5d50; color: #fff; box-shadow: 0 2px 6px rgba(47,93,80,0.35); }
.name { flex: 1; font-size: 16px; }
.amount { font-variant-numeric: tabular-nums; color: #5b5444; }
.share { display: none; margin: 8px 16px; padding: 14px; border-radius: 12px; background: #2f5d50; color: #fff; text-align: center; font-weight: 600; font-size: 16px; }
.after .share { display: block; }
.total { margin: 16px 20px; display: flex; justify-content: space-between; font-size: 15px; color: #77705f; }
</style>
<body><script>document.body.className = location.hash.slice(1);</script>
<header><h1>Field receipts</h1><p class="sub">Trip to the coast · 4 receipts</p></header>
<ul>
<li><span class="initial">B</span><span class="name">Bakery on the pier</span><span class="amount">£8.40</span></li>
<li><span class="initial">F</span><span class="name">Ferry tickets</span><span class="amount">£36.00</span></li>
<li><span class="initial">T</span><span class="name">Tide pool guide</span><span class="amount">£12.50</span></li>
<li><span class="initial">C</span><span class="name">Campsite</span><span class="amount">£54.00</span></li>
</ul>
<div class="total"><span>Total</span><span>£110.90</span></div>
<div class="share">Share receipts</div>
</body>
